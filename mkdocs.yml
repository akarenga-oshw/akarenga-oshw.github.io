site_name: Akarenga OSHW Docs

nav:
  - ホーム: index.md
  - ハードウェア:
      - ボード:
          - hardware/boards/index.md
          - Akarenga UNO R4 Minima:
              - hardware/boards/uno-r4-minima/index.md
              - チュートリアル:
                  - Getting Started: hardware/boards/uno-r4-minima/tutorials/getting-started/index.md
  - タグ: tags.md

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: black

plugins:
  - search
  - meta
  - tags
  - git-revision-date-localized:
      locale: ja
      timezone: Asia/Tokyo
      # 表示は「1か月前」のような相対表記 (ツールチップに正確な日時が出る)
      type: timeago
      # 作成日も表示する
      enable_creation_date: true
      # git 履歴が取得できない場合 (未コミット、浅い clone) はビルド日時を使う
      fallback_to_build_date: true
