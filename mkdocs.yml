site_name: Akarenga OSHW Docs

nav:
  - ホーム: index.md
  - ハードウェア:
      - ボード:
          - hardware/boards/index.md
          - Akarenga UNO R4 Minima:
              - hardware/boards/uno-r4-minima/index.md
              - チュートリアル:
                  - Getting Started: hardware/boards/uno-r4-minima/tutorials/getting-started/index.md
  - タグ: tags.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  # 囲み注記 (!!! note "タイトル")
  - admonition
  # 折りたたみ式の注記 (??? note "タイトル")
  - pymdownx.details
  # コードブロックのシンタックスハイライト
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # 外部ファイルの取り込み (--8<-- "path")。パスは docs/ 起点
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.superfences

theme:
  name: material
  custom_dir: overrides
  features:
    # コードブロックにコピーボタンを表示
    - content.code.copy
  palette:
    scheme: slate
    primary: black

plugins:
  - search
  - meta
  - tags
  - git-revision-date-localized:
      locale: ja
      timezone: Asia/Tokyo
      # 表示は「1か月前」のような相対表記 (ツールチップに正確な日時が出る)
      type: timeago
      # 作成日も表示する
      enable_creation_date: true
      # git 履歴が取得できない場合 (未コミット、浅い clone) はビルド日時を使う
      fallback_to_build_date: true
